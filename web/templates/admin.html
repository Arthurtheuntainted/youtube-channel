<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cavern Wireless</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-page">
    <div class="container wide">
        <header class="admin-header">
            <h1>🎛️ Admin Dashboard</h1>
            <div class="admin-controls">
                <button id="btn-pause" class="btn-warning" onclick="pausePlayback()">⏸️ Pause</button>
                <button id="btn-resume" class="btn-success" onclick="resumePlayback()">▶️ Resume</button>
                <button id="btn-skip" class="btn-danger" onclick="skipCurrent()">⏭️ Skip Current</button>
                <a href="/logout" class="btn-secondary">Logout</a>
            </div>
        </header>

        <section class="status-card">
            <h2>📋 All Submissions</h2>
            <div class="table-container">
                <table id="stories-table">
                    <thead>
                        <tr>
                            <th>Ticket</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Status</th>
                            <th>Submitted</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stories-body">
                        <tr><td colspan="6" class="loading">Loading stories...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="status-card">
            <h2>📊 System Info</h2>
            <div id="system-info" class="system-grid">
                <p class="loading">Loading system status...</p>
            </div>
        </section>

        <footer>
            <p><a href="/">← Back to Public Status</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Admin-specific functions
        async function pausePlayback() {
            await fetch('/api/admin/pause', { method: 'POST' });
            alert('Playback paused');
        }
        
        async function resumePlayback() {
            await fetch('/api/admin/resume', { method: 'POST' });
            alert('Playback resumed');
        }
        
        async function skipCurrent() {
            const res = await fetch('/api/admin/skip', { method: 'POST' });
            const data = await res.json();
            alert(data.success ? 'Skipped' : data.message);
        }
        
        async function approveStory(id) {
            await fetch(`/api/admin/approve/${id}`, { method: 'POST' });
            loadStories();
        }
        
        async function rejectStory(id) {
            const reason = prompt("Enter rejection reason:");
            if (reason) {
                await fetch(`/api/admin/reject/${id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ reason })
                });
                loadStories();
            }
        }
        
        async function deleteStory(id) {
            if (confirm("Are you sure you want to delete this story?")) {
                await fetch(`/api/admin/delete/${id}`, { method: 'POST' });
                loadStories();
            }
        }
        
        async function retryStory(id) {
            await fetch(`/api/admin/retry/${id}`, { method: 'POST' });
            loadStories();
        }
        
        async function loadStories() {
            const res = await fetch('/api/admin/stories');
            const stories = await res.json();
            
            const tbody = document.getElementById('stories-body');
            tbody.innerHTML = '';
            
            stories.forEach(s => {
                const tr = document.createElement('tr');
                
                let actions = '';
                if (s.status === 'PENDING_APPROVAL') {
                    actions = `
                        <button class="btn-sm btn-success" onclick="approveStory(${s.id})">✓</button>
                        <button class="btn-sm btn-danger" onclick="rejectStory(${s.id})">✗</button>
                    `;
                } else if (s.status === 'FAILED') {
                    actions = `
                        <button class="btn-sm btn-warning" onclick="retryStory(${s.id})">Retry</button>
                        <button class="btn-sm btn-danger" onclick="deleteStory(${s.id})">Delete</button>
                    `;
                } else {
                    actions = `<button class="btn-sm btn-danger" onclick="deleteStory(${s.id})">Delete</button>`;
                }
                
                tr.innerHTML = `
                    <td>${s.ticket}</td>
                    <td>${escapeHtml(s.title)}</td>
                    <td>${escapeHtml(s.author)}</td>
                    <td><span class="status-badge status-${s.status.toLowerCase().replace('_', '-')}">${s.status}</span></td>
                    <td>${new Date(s.created_at).toLocaleString()}</td>
                    <td class="actions">${actions}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load on page load
        loadStories();
    </script>
</body>
</html>
